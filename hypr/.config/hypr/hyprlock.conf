# Colors kept in one place; hyprlock substitutes the $variables below.
$base = rgba(191724ee)
$surface = rgba(26233aff)
$border = rgba(403d52ff)
$text = rgba(e0def4ff)
$muted = rgba(6e6a86ff)
$accent = rgba(9ccfd8ff)

background {
    monitor =
    color = $base
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $border
    inner_color = $surface
    font_color = $text
    placeholder_text = <i>Password</i>
    fail_text = <i>Wrong password</i>
    fade_on_empty = false
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $muted
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
