# 00-dots.conf - TLP drop-in for this setup
# Performance on AC, power-saver on battery. Applied by install.sh.

# Always switch profiles with the power source.
TLP_AUTO_SWITCH=1
TLP_PROFILE_AC=PRF
TLP_PROFILE_BAT=SAV
TLP_PROFILE_DEFAULT=BAL

# AC power: performance.
CPU_SCALING_GOVERNOR_ON_PRF=performance
CPU_ENERGY_PERF_POLICY_ON_PRF=performance
CPU_BOOST_ON_PRF=1
CPU_HWP_DYN_BOOST_ON_PRF=1
PLATFORM_PROFILE_ON_PRF=performance
PCIE_ASPM_ON_PRF=default
WIFI_PWR_ON_PRF=off
RUNTIME_PM_ON_PRF=on
SATA_LINKPWR_ON_PRF=max_performance
INTEL_GPU_POWER_PROFILE_ON_PRF=base

# Battery power: power-saver.
CPU_SCALING_GOVERNOR_ON_SAV=powersave
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_BOOST_ON_SAV=0
CPU_HWP_DYN_BOOST_ON_SAV=0
PLATFORM_PROFILE_ON_SAV=low-power
PCIE_ASPM_ON_SAV=powersupersave
WIFI_PWR_ON_SAV=on
RUNTIME_PM_ON_SAV=auto
SATA_LINKPWR_ON_SAV=min_power
INTEL_GPU_POWER_PROFILE_ON_SAV=power_saving

# Autosuspend USB devices.
USB_AUTOSUSPEND=1
