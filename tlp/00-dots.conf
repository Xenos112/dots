# 00-dots.conf - TLP drop-in for this setup
# Balanced on AC, a lighter power-saver on battery. Applied by install.sh.
#
# NOTE: TLP does not control the fan; the fan curve is handled by the
# firmware/EC. TLP only selects the platform profile and CPU power settings.

# Always switch profiles with the power source.
TLP_AUTO_SWITCH=1
TLP_PROFILE_AC=BAL
TLP_PROFILE_BAT=SAV
TLP_PROFILE_DEFAULT=BAL

# AC power: balanced. Uses TLP's balanced (BAL) defaults, so no _ON_BAL
# overrides are needed here.

# Battery power: power-saver, but snappy enough for daily use.
# CPU boost is enabled and the firmware is not held in its lowest profile;
# WiFi power saving is kept, PCIe ASPM is left at the firmware default so
# storage/IO does not feel sluggish.
CPU_SCALING_GOVERNOR_ON_SAV=powersave
CPU_ENERGY_PERF_POLICY_ON_SAV=balance_power
CPU_BOOST_ON_SAV=1
PLATFORM_PROFILE_ON_SAV=balanced
PCIE_ASPM_ON_SAV=default
WIFI_PWR_ON_SAV=on
RUNTIME_PM_ON_SAV=auto
SATA_LINKPWR_ON_SAV=min_power
INTEL_GPU_POWER_PROFILE_ON_SAV=power_saving

# Autosuspend USB devices.
USB_AUTOSUSPEND=1
